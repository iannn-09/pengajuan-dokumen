version: '3.8'

services:
  # ─── 1. PostgreSQL Database Service ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pengajuan_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dokumen
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. Go API Backend Service ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pengajuan_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: dokumen
      DB_SSLMODE: disable
      CORS_ALLOW_ORIGIN: "http://localhost:5173"
      JWT_SECRET: "pengajuan-dokumen-super-secret-key-2026"
      WHATSAPP_NOTIFIER_ENABLED: "true"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      TZ: Asia/Jakarta
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # ─── 3. Vue 3 Nginx Frontend Service ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pengajuan_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
