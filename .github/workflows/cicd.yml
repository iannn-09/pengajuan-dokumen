name: CI/CD Pipeline - Pengajuan Dokumen & Docker Hub

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  # ─── 1. Continuous Integration: Backend Go (Build & Verification) ───────
  backend-ci:
    name: 🐹 Go Backend CI (Build & Verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Install Dependencies
        run: |
          cd backend
          go mod download

      - name: Verify Code Compilation
        run: |
          cd backend
          go build -v ./...

  # ─── 2. Continuous Integration: Frontend Vue (Build & Assets Verification)
  frontend-ci:
    name: ⚡ Vue Frontend CI (Build & Assets Verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Vue Production Bundle
        run: |
          cd frontend
          npm run build

  # ─── 3. Docker Hub Integration: Build & Push Images to Docker Hub ─────────
  docker-hub-push:
    name: 🐳 Docker Hub Build & Push
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pengajuan-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pengajuan-backend:${{ github.sha }}

      - name: Build and Push Frontend Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pengajuan-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pengajuan-frontend:${{ github.sha }}
